# ==============================================================================
# DOCKER COMPOSE - EBD REVISTA MANAGER
# Primeira Igreja Batista de Cataguases
# Otimizado para Umbrel OS e Servidores Linux Self-Hosted (100% Custo Zero)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Aplicação Web EBD Revista Manager (Next.js 14 Standalone)
  # ----------------------------------------------------------------------------
  ebd-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configure NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Configure NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: ebd-revista-manager
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      - UPLOAD_DIR=/app/data/uploads
      - CRON_SECRET=${CRON_SECRET:-}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-evolution}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL:-http://evolution-api:8080}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:?Configure WHATSAPP_API_KEY forte no arquivo .env}
      - WHATSAPP_INSTANCE=${WHATSAPP_INSTANCE:-pib-cataguases-ebd}
      - WHATSAPP_GROUP_JID=${WHATSAPP_GROUP_JID}
      - WHATSAPP_DEFAULT_MESSAGE=${WHATSAPP_DEFAULT_MESSAGE}
    volumes:
      # Volume persistente Docker: evita permissões incorretas no checkout do Portainer
      - ebd_uploads:/app/data/uploads
    depends_on:
      evolution-api:
        condition: service_started
    networks:
      - ebd-network

  # ----------------------------------------------------------------------------
  # 2. Evolution API v2 (API de WhatsApp Self-Hosted e Gratuita - Baileys)
  # ----------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: ebd-whatsapp-evolution
    restart: unless-stopped
    ports:
      - "${WHATSAPP_HOST_PORT:-8081}:8080"
    environment:
      - SERVER_URL=${WHATSAPP_EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${WHATSAPP_API_KEY:?Configure WHATSAPP_API_KEY forte no arquivo .env}
      - CONFIG_SESSION_PHONE_CLIENT=EBD Manager PIB Cataguases
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - LOG_LEVEL=ERROR,WARN,INFO
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Configure EVOLUTION_DB_PASSWORD no Portainer}@evolution-db:5432/evolution
      - DATABASE_CONNECTION_CLIENT_NAME=ebd-evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      # No Redis service is part of this stack; use Evolution's local cache.
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
    depends_on:
      evolution-db:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - ebd-network

  evolution-db:
    image: postgres:15-alpine
    container_name: ebd-evolution-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD:?Configure EVOLUTION_DB_PASSWORD no Portainer}
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ebd-network

# ------------------------------------------------------------------------------
# Volumes Persistentes Docker
# ------------------------------------------------------------------------------
volumes:
  ebd_uploads:
    driver: local
  evolution_instances:
    driver: local
  evolution_store:
    driver: local
  evolution_postgres:
    driver: local

# ------------------------------------------------------------------------------
# Rede Interna Isolada
# ------------------------------------------------------------------------------
networks:
  ebd-network:
    driver: bridge
