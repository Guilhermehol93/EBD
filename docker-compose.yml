# ==============================================================================
# DOCKER COMPOSE - EBD REVISTA MANAGER
# Primeira Igreja Batista de Cataguases
# Otimizado para Umbrel OS e Servidores Linux Self-Hosted (100% Custo Zero)
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Aplicação Web EBD Revista Manager (Next.js 14 Standalone)
  # ----------------------------------------------------------------------------
  ebd-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Configure NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Configure NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: ebd-revista-manager
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-3001}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3001}
      - UPLOAD_DIR=/app/data/uploads
      - CRON_SECRET=${CRON_SECRET:-}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-evolution}
      - WHATSAPP_API_URL=${WHATSAPP_API_URL:-http://evolution-api:8080}
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY:?Configure WHATSAPP_API_KEY forte no arquivo .env}
      - WHATSAPP_INSTANCE=${WHATSAPP_INSTANCE:-pib-cataguases-ebd}
      - WHATSAPP_GROUP_JID=${WHATSAPP_GROUP_JID}
      - WHATSAPP_DEFAULT_MESSAGE=${WHATSAPP_DEFAULT_MESSAGE}
    volumes:
      # Armazenamento persistente local dos arquivos PDF das revistas e banners
      - ./data/uploads:/app/data/uploads
    depends_on:
      - evolution-api
    networks:
      - ebd-network

  # ----------------------------------------------------------------------------
  # 2. Evolution API v2 (API de WhatsApp Self-Hosted e Gratuita - Baileys)
  # ----------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:v2.1.2
    container_name: ebd-whatsapp-evolution
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WHATSAPP_HOST_PORT:-8081}:8080"
    environment:
      - SERVER_URL=${WHATSAPP_EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${WHATSAPP_API_KEY:?Configure WHATSAPP_API_KEY forte no arquivo .env}
      - CONFIG_SESSION_PHONE_CLIENT=EBD Manager PIB Cataguases
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - LOG_LEVEL=ERROR,WARN,INFO
      - DATABASE_SAVE_DATA_INSTANCE=true
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    networks:
      - ebd-network

# ------------------------------------------------------------------------------
# Volumes Persistentes Docker
# ------------------------------------------------------------------------------
volumes:
  evolution_instances:
    driver: local
  evolution_store:
    driver: local

# ------------------------------------------------------------------------------
# Rede Interna Isolada
# ------------------------------------------------------------------------------
networks:
  ebd-network:
    driver: bridge
